services:
   
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace
    
    ports:
      - "8000:8000"

    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@db:5432/monitor_db
      - CHRONEXIS_API_KEY=${CHRONEXIS_API_KEY}
    depends_on:
      - redis
      - db
    networks:
      - monitor_network
  
  redis:
    image: redis:7-alpine
    ports:
      - 6380:6379
    networks:
      - monitor_network
  db:
   image: postgres:16-alpine
   environment: 
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=monitor_db
   ports:
      - 5433:5432
   volumes: 
      - postgres_data:/var/lib/postgresql/data
   networks: 
      - monitor_network

networks:
  monitor_network:
    driver: bridge

volumes:
  postgres_data:
    